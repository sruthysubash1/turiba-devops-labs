apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: course
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/sruthysubash1/turiba-devops-labs/api:88314695cc1c5cdaf516711184d7849866d02309
          ports:
            - containerPort: 5000
